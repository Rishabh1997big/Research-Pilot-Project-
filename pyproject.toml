[project]
name = "researchpilot"
version = "0.1.0"
description = "Multi-agent research assistant: cited reports with human review, sentiment analysis, a RAG chatbot and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
pythonpath = ["."]
markers = ["live: calls the real LLM APIs with the keys in .env (run with: uv run pytest -m live)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses Depends() in defaults by design

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
